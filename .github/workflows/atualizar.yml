name: Atualizar cotas

on:
  schedule:
    - cron: "15 10,21 * * *"   # 07h15 e 18h15 em São Luís (UTC-3)
  workflow_dispatch:            # permite rodar manualmente

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar cotas da CVM
        run: python scripts/atualizar_cotas.py
      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cotas.json
          git diff --cached --quiet || (git commit -m "Atualiza cotas $(date -u +%F)" && git push)
